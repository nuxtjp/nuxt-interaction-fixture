name: Product CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: product-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NUXT_TELEMETRY_DISABLED: '1'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: fixture
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install declared toolchains
        run: |
          npm install --global pnpm@10.29.3 --ignore-scripts
          rustup toolchain install 1.97 --profile minimal --component clippy
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/cargo-target" >> "$GITHUB_ENV"
          echo "INTERACTION_FIXTURE_HANDLER=$RUNNER_TEMP/cargo-target/debug/interaction-fixture-handler" >> "$GITHUB_ENV"
      - name: Verify official Rust contract and isolated browser composition
        working-directory: fixture
        run: |
          cargo +1.97 clippy --locked --manifest-path handler/Cargo.toml --all-targets -- -D warnings
          cargo +1.97 build --locked --manifest-path handler/Cargo.toml
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm test:dependency-security
          pnpm exec playwright install --with-deps chromium
          node tools/check.mjs build
          node tools/check.mjs browser
